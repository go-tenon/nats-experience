# 多产品共用的 NATS（JetStream）。安装见 README.md。
name: nats

services:
  nats:
    image: nats:2.15.3-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    restart: unless-stopped
    ports:
      - "4222:4222"           # 客户端，访问来源由云平台安全组控制
      - "127.0.0.1:8222:8222" # 监控，只给本机
    volumes:
      - ./config:/etc/nats:ro # 挂载目录：编辑器替换文件后，重新加载能读到新内容
      - ./data:/data
    environment:
      GOMEMLIMIT: ${GOMEMLIMIT:-1200MiB} # 内存的 60–80%
    stop_grace_period: 30s
    ulimits:
      nofile: 65536
    logging:
      options:
        max-size: 100m
        max-file: "10"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 3s
      retries: 3

  # nats 命令行：docker compose run --rm cli <参数>，见 docs/02-operations.md
  cli:
    image: natsio/nats-box:0.20.2
    profiles: [tools]
    entrypoint: ["nats"]
    working_dir: /work
    volumes:
      - ./cli:/nsc/.config/nats # context（含密码），不提交
      - ./backup:/work/backup    # 迁移时的备份
    depends_on: [nats]

  # 接入 OpenObserve，见 docs/04-openobserve.md
  exporter:
    image: natsio/prometheus-nats-exporter:0.20.3
    profiles: [monitoring]
    command: ["-varz", "-connz", "-healthz", "-accstatz", "-jsz=all", "http://nats:8222"]
    restart: unless-stopped
    depends_on: [nats]

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: [monitoring]
    command: ["--config=/etc/otelcol/otelcol.yaml"]
    restart: unless-stopped
    volumes:
      - ./config/otelcol.yaml:/etc/otelcol/otelcol.yaml:ro
    environment:
      OPENOBSERVE_ENDPOINT: ${OPENOBSERVE_ENDPOINT:-}
      OPENOBSERVE_TOKEN: ${OPENOBSERVE_TOKEN:-}
    depends_on: [exporter]
