# NATS：docker compose up -d
# 接入 OpenObserve：docker compose --profile observe up -d（需要 .env）

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

services:
  nats:
    image: nats:2.15.3-alpine
    command: [nats-server, -c, /etc/nats/nats.conf]
    network_mode: host
    restart: always
    environment:
      GOMEMLIMIT: ${NATS_GOMEMLIMIT:-1200MiB}   # 内存的 60–80%
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - ./resolver.conf:/etc/nats/resolver.conf:ro
      - nats-data:/data
    logging: *logging

  # 读取 127.0.0.1:8222，指标在 127.0.0.1:7777
  nats-exporter:
    profiles: [observe]
    image: natsio/prometheus-nats-exporter:0.20.3
    command: [-addr, 127.0.0.1, -port, "7777", -varz, -connz, -healthz, -accstatz, -jsz=all, http://127.0.0.1:8222]
    network_mode: host
    restart: always
    logging: *logging

  # 采集 NATS 指标和本机容器日志，以 OTLP 推送到 OpenObserve
  otelcol:
    profiles: [observe]
    image: otel/opentelemetry-collector-contrib:0.165.0
    network_mode: host
    restart: always
    user: "0"                                   # 读取 /var/lib/docker/containers
    env_file:
      - path: .env                              # OO_URL、OO_ORG、OO_AUTH、OO_STREAM
        required: false
    volumes:
      - ./otelcol.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    logging: *logging

volumes:
  nats-data:
    name: nats-data
