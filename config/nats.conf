# 修改后执行 docker compose kill -s HUP nats 重新加载，不中断连接；server_name 不能热加载
server_name: nats-1

listen: 0.0.0.0:4222
# 监控。容器外只映射到本机，见 compose.yaml
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  # 每秒同步磁盘，断电最多丢约 1 秒的写入
  sync_interval: "1s"
  # 所有账号合计的磁盘上限
  max_file_store: 30GB
  # 实时频道的在线成员使用内存存储
  max_memory_store: 256MB
}

# 账号、用户和密码，不提交，见 accounts.conf.example
include accounts.conf
