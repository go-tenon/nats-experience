receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: nats
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:7777"]
  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: end
    operators:
      - type: container
        format: docker
        add_metadata_from_filepath: false

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
  resourcedetection:
    detectors: [system]
    system:
      hostname_sources: [os]
  batch: {}

exporters:
  otlphttp/openobserve:
    endpoint: ${env:OO_URL}/api/${env:OO_ORG}
    headers:
      Authorization: ${env:OO_AUTH}
      stream-name: ${env:OO_STREAM}

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [filelog]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlphttp/openobserve]
